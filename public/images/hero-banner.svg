<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bgGradient)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Ambient Light Waves -->
  <path d="M-100 200 C 300 100, 600 350, 1300 150 L 1300 480 L -100 480 Z" fill="url(#auroraGrad)" />

  <!-- Left Side: Branding and Typography -->
  <g transform="translate(80, 80)">
    <!-- Logo Badge -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="12" fill="url(#emeraldGlow)" filter="url(#glow)"/>
      <path d="M 16 24 C 16 18, 32 18, 32 24 C 32 30, 24 30, 24 36" fill="none" stroke="#040711" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="24" cy="40" r="1.5" fill="#040711"/>
    </g>

    <!-- Version Tag -->
    <g transform="translate(62, 10)">
      <rect width="140" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
      <text x="70" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">v1.0.0 ENTERPRISE</text>
    </g>

    <!-- Title -->
    <text x="0" y="105" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      SlideCaptcha
    </text>
    <text x="280" y="105" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      行为验证码
    </text>

    <!-- Subtitle -->
    <text x="0" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      高可用滑动拼图 · 生物轨迹动力学识别 · 二次核销防重放 · 零 C++ 依赖
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 195)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="22" y="10" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
        <tspan fill="#f1f5f9" font-weight="bold">生物手势识别：</tspan>基于菲茨定律、加速度二阶导数与微颤熵判别真机拖拽
      </text>

      <circle cx="6" cy="38" r="4" fill="#10b981"/>
      <text x="22" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
        <tspan fill="#f1f5f9" font-weight="bold">防逆向与防爬：</tspan>目标缺口绝对坐标绝不出域，服务端 HMAC-SHA256 防伪签名
      </text>

      <circle cx="6" cy="70" r="4" fill="#10b981"/>
      <text x="22" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
        <tspan fill="#f1f5f9" font-weight="bold">容器开箱即用：</tspan>纯矢量 SVG 动态切片，无需安装 node-canvas / node-gyp 编译工具
      </text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="105" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52" y="19" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Node.js 18+</text>

      <rect x="115" y="0" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="162" y="19" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Express / Koa</text>

      <rect x="220" y="0" width="85" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="262" y="19" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">React SDK</text>

      <rect x="315" y="0" width="115" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="372" y="19" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Two-Stage Ticket</text>
    </g>
  </g>

  <!-- Right Side: Visual Mockup Illustration -->
  <g transform="translate(760, 60)">
    <!-- Main Device Glass Card -->
    <rect width="360" height="360" rx="20" fill="#090e1a" stroke="#1e293b" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Header bar -->
    <path d="M 0 20 Q 0 0 20 0 L 340 0 Q 360 0 360 20 L 360 50 L 0 50 Z" fill="#0f172a" />
    <circle cx="25" cy="25" r="5" fill="#ef4444" />
    <circle cx="42" cy="25" r="5" fill="#f59e0b" />
    <circle cx="59" cy="25" r="5" fill="#10b981" />
    <text x="180" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">安全滑动行为鉴权</text>

    <!-- Captcha Canvas Area -->
    <g transform="translate(20, 65)">
      <rect width="320" height="180" rx="12" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Mountain & Aurora Silhouettes inside canvas -->
      <path d="M 0 120 Q 80 40 160 100 T 320 60 L 320 180 L 0 180 Z" fill="#064e3b" opacity="0.6"/>
      <path d="M 0 145 Q 120 90 200 135 T 320 110 L 320 180 L 0 180 Z" fill="#0f172a"/>

      <!-- Target Slot (Cutout) -->
      <path d="M 210 50 h 15 a 6 6 0 0 1 12 0 h 15 v 15 a 6 6 0 0 0 0 12 v 15 h -15 a 6 6 0 0 1 -12 0 h -15 v -15 a 6 6 0 0 0 0 -12 z" fill="#000000" fill-opacity="0.75" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Trajectory overlay line -->
      <path d="M 20 110 Q 80 102 120 108 T 180 82 T 210 50" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <circle cx="20" cy="110" r="3" fill="#10b981"/>
      <circle cx="80" cy="102" r="2.5" fill="#34d399"/>
      <circle cx="120" cy="108" r="2.5" fill="#34d399"/>
      <circle cx="180" cy="82" r="2.5" fill="#34d399"/>
      <circle cx="210" cy="50" r="4" fill="#38bdf8" filter="url(#glow)"/>

      <!-- Sliding Puzzle Piece -->
      <g transform="translate(180, 50)">
        <path d="M 0 0 h 15 a 6 6 0 0 1 12 0 h 15 v 15 a 6 6 0 0 0 0 12 v 15 h -15 a 6 6 0 0 1 -12 0 h -15 v -15 a 6 6 0 0 0 0 -12 z" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
      </g>
    </g>

    <!-- Slider Track -->
    <g transform="translate(20, 260)">
      <rect width="320" height="42" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      <!-- Active fill bar -->
      <rect width="200" height="42" rx="10" fill="#10b981" fill-opacity="0.15"/>
      <text x="175" y="26" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">X: 180px · 采样: 52 点</text>
      
      <!-- Slider button -->
      <g transform="translate(160, 2)">
        <rect width="38" height="38" rx="8" fill="#10b981" filter="url(#glow)"/>
        <path d="M 15 13 L 23 19 L 15 25" fill="none" stroke="#040711" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Verification Badge -->
    <g transform="translate(20, 315)">
      <text x="5" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">✓ 生物轨迹分析通过</text>
      <text x="315" y="18" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">Score: 98 / 100</text>
    </g>
  </g>
</svg>
